<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Music Antenna</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: 'Roboto', -apple-system, sans-serif;
            background-color: #0F0F0F; color: #F1F1F1;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px 0;
        }
        .container {
            width: 100%; max-width: 420px; padding: 32px 24px;
            background: #1C1C1C; border-radius: 16px; border: 1px solid #303030;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 20px;
        }
        .logo { display: flex; justify-content: center; margin-bottom: 24px; }
        .logo img { width: 100%; max-width: 180px; background: #fff; padding: 12px; border-radius: 12px; }
        h2 { text-align: center; margin: 0 0 8px 0; font-size: 24px; font-weight: 700; }
        p.subtitle { text-align: center; color: #AAAAAA; font-size: 14px; margin: 0 0 24px 0; }
        
        .input-group { position: relative; margin-bottom: 16px; }
        .input-group input {
            width: 100%; padding: 14px 40px 14px 14px;
            border-radius: 8px; background: #272727; 
            color: #FFFFFF !important; 
            -webkit-text-fill-color: #FFFFFF !important;
            border: 1px solid #303030; 
            font-size: 15px;
        }
        .input-group input:focus { border-color: #FF0033; outline: none; }
        
        .toggle-eye {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #888; display: flex; align-items: center;
        }
        .toggle-eye svg { width: 20px; height: 20px; fill: currentColor; }

        button {
            width: 100%; padding: 14px; background: #FF0033; color: #fff;
            border-radius: 8px; font-weight: 700; border: none;
            cursor: pointer; margin-bottom: 12px; font-size: 16px;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .back-btn { background: transparent; border: 1px solid #303030; color: #AAAAAA; }
        
        .msg { text-align: center; margin-bottom: 20px; font-size: 14px; padding: 12px; border-radius: 8px; display: none; font-weight: 500; }
        .msg.error { background: rgba(255, 78, 69, 0.1); color: #FF4E45; border: 1px solid #FF4E45; display: block; }
        .msg.success { background: rgba(43, 166, 64, 0.1); color: #2BA640; border: 1px solid #2BA640; display: block; }
        
        /* DEBUG CONSOLE */
        .debug-box {
            margin-top: 24px; padding: 12px; background: #000; border: 1px solid #333; 
            border-radius: 8px; font-family: monospace; font-size: 11px; color: #00ff00; 
            max-height: 150px; overflow-y: auto; word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/music-antenna-logo.png" alt="Music Antenna">
        </div>
        
        <h2>Create New Password</h2>
        <div id="msg" class="msg"></div>
        
        <form id="resetForm">
            <div class="input-group">
                <input type="password" id="newPassword" placeholder="New Password" required minlength="6">
                <div class="toggle-eye" onclick="toggleVisibility('newPassword', this)">
                    <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </div>
            </div>
            
            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" required minlength="6">
                <div class="toggle-eye" onclick="toggleVisibility('confirmPassword', this)">
                    <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </div>
            </div>

            <button type="submit" id="submitBtn">Update Password</button>
            <button type="button" class="back-btn" onclick="window.location.href='/'">Back to Login</button>
        </form>

        <!-- This will show us EXACTLY what is going wrong -->
        <div id="debugConsole" class="debug-box">Initializing...</div>
    </div>

    <script>
        const debugLog = (msg) => {
            const box = document.getElementById('debugConsole');
            box.innerHTML += "<br>> " + msg;
            console.log(msg);
        };

        debugLog("Page Loaded. URL Hash: " + (window.location.hash ? window.location.hash.substring(0, 30) + '...' : 'EMPTY'));

        const SUPABASE_URL = 'https://wcuqehdequrealcndkyw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-iD2D0ploxUh4w_PLKOirQ_ih4JcGKt';
        
        debugLog("Supabase URL: " + SUPABASE_URL);
        debugLog("Supabase Key starts with: " + SUPABASE_KEY.substring(0, 15) + "...");

        let supabase;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                auth: { detectSessionInUrl: true, flowType: 'implicit' }
            });
            debugLog("Client created successfully.");
        } catch (e) {
            debugLog("CLIENT CREATION ERROR: " + e.message);
        }

        const form = document.getElementById('resetForm');
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submitBtn');
        const p1Input = document.getElementById('newPassword');
        const p2Input = document.getElementById('confirmPassword');

        function toggleVisibility(id, icon) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
            icon.style.color = input.type === 'text' ? '#FF0033' : '#888';
        }

        // Listen to auth changes
        supabase.auth.onAuthStateChange((event, session) => {
            debugLog("Auth Event Fired: " + event);
            if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
                debugLog("Session found! User: " + (session?.user?.email || 'Unknown'));
            }
        });

        // Check session after a short delay
        setTimeout(async () => {
            const { data, error } = await supabase.auth.getSession();
            if (error) {
                debugLog("getSession ERROR: " + error.message);
            } else if (data.session) {
                debugLog("Active Session Found.");
            } else {
                debugLog("NO SESSION FOUND. Link may be expired.");
            }
        }, 2000);

        // Submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (p1Input.value !== p2Input.value) {
                msg.className = 'msg error';
                msg.textContent = 'Passwords do not match.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';
            msg.className = 'msg';
            debugLog("Attempting to update password...");

            try {
                const { data, error } = await supabase.auth.updateUser({ password: p1Input.value });
                
                if (error) {
                    debugLog("SUPABASE ERROR: " + error.message);
                    throw error;
                }

                debugLog("SUCCESS! User data: " + JSON.stringify(data.user?.email));
                msg.className = 'msg success';
                msg.textContent = 'Password updated successfully! Redirecting...';
                
                await supabase.auth.signOut();
                setTimeout(() => window.location.href = '/', 2000);
            } catch (err) {
                msg.className = 'msg error';
                msg.textContent = err.message || 'Error updating password.';
                btn.disabled = false;
                btn.textContent = 'Update Password';
                debugLog("CATCH BLOCK: " + err.message);
            }
        });
    </script>
</body>
</html>
