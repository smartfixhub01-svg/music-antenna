<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Music Antenna</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Roboto', sans-serif;
            background-color: #0F0F0F; color: #F1F1F1;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 400px; padding: 24px;
            background: #1C1C1C; border-radius: 16px; border: 1px solid #303030;
            box-sizing: border-box;
        }
        .logo { display: flex; justify-content: center; margin-bottom: 24px; }
        .logo img { width: 100%; max-width: 180px; background: #fff; padding: 12px; border-radius: 12px; }
        h2 { text-align: center; margin-bottom: 24px; }
        
        /* FIX FOR INVISIBLE TEXT */
        input {
            width: 100%; padding: 14px; margin-bottom: 16px;
            border-radius: 8px; background: #272727; 
            color: #FFFFFF !important; 
            -webkit-text-fill-color: #FFFFFF !important;
            border: 1px solid #303030; box-sizing: border-box;
            font-size: 16px;
        }
        input::placeholder {
            color: #888888 !important;
            -webkit-text-fill-color: #888888 !important;
        }
        
        button {
            width: 100%; padding: 14px; background: #FF0033; color: #fff;
            border-radius: 8px; font-weight: bold; border: none;
            cursor: pointer; margin-bottom: 12px; font-size: 16px;
        }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .back-btn {
            background: transparent; border: 1px solid #FF0033;
            color: #FF0033;
        }
        
        .msg { text-align: center; margin-bottom: 16px; font-size: 14px; padding: 10px; border-radius: 8px; }
        .error { background: rgba(255, 78, 69, 0.1); color: #FF4E45; border: 1px solid #FF4E45; }
        .success { background: rgba(43, 166, 64, 0.1); color: #2BA640; border: 1px solid #2BA640; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/music-antenna-logo.png" alt="Music Antenna">
        </div>
        <h2>Create New Password</h2>
        <div id="msg" class="msg" style="display:none;"></div>
        
        <form id="resetForm">
            <input type="password" id="newPassword" placeholder="New Password" required minlength="6" autocomplete="new-password">
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required minlength="6" autocomplete="new-password">
            <button type="submit" id="submitBtn">Update Password</button>
            <button type="button" class="back-btn" onclick="window.location.href='/'">Back to Login</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://wcuqehdequrealcndkyw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-iD2D0ploxUh4w_PLKOirQ_ih4JcGKt';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('resetForm');
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submitBtn');

        // Check if session exists (Supabase should catch the hash token automatically)
        setTimeout(async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                msg.style.display = 'block';
                msg.className = 'msg error';
                msg.textContent = 'Session expired or invalid link. Please request a new one.';
            }
        }, 1000);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;

            msg.style.display = 'none';

            if (p1 !== p2) {
                msg.style.display = 'block';
                msg.className = 'msg error';
                msg.textContent = 'Passwords do not match.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const { error } = await supabase.auth.updateUser({ password: p1 });
                if (error) throw error;

                msg.style.display = 'block';
                msg.className = 'msg success';
                msg.textContent = 'Password updated successfully! Redirecting to login...';
                
                await supabase.auth.signOut();
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } catch (err) {
                msg.style.display = 'block';
                msg.className = 'msg error';
                msg.textContent = err.message || 'Error updating password. Check console.';
                btn.disabled = false;
                btn.textContent = 'Update Password';
                console.error("Password Update Error:", err);
            }
        });
    </script>
</body>
</html>
