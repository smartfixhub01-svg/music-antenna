<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password - Music Antenna</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: 'Roboto', -apple-system, sans-serif;
            background-color: #0F0F0F; color: #F1F1F1;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px 0;
        }
        .container {
            width: 100%; max-width: 420px; padding: 32px 24px;
            background: #1C1C1C; border-radius: 16px; border: 1px solid #303030;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 20px;
        }
        .logo { display: flex; justify-content: center; margin-bottom: 24px; }
        .logo img { width: 100%; max-width: 180px; background: #fff; padding: 12px; border-radius: 12px; }
        h2 { text-align: center; margin: 0 0 8px 0; font-size: 24px; font-weight: 700; }
        p.subtitle { text-align: center; color: #AAAAAA; font-size: 14px; margin: 0 0 24px 0; }
        
        .input-group { position: relative; margin-bottom: 16px; }
        .input-group input {
            width: 100%; padding: 14px 40px 14px 14px;
            border-radius: 8px; background: #272727;
            color: #FFFFFF !important;
            -webkit-text-fill-color: #FFFFFF !important;
            border: 1px solid #303030;
            font-size: 15px;
        }
        .input-group input:focus { border-color: #FF0033; outline: none; }
        
        .toggle-eye {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #888; display: flex; align-items: center;
        }
        .toggle-eye svg { width: 20px; height: 20px; fill: currentColor; }

        button {
            width: 100%; padding: 14px; background: #FF0033; color: #fff;
            border-radius: 8px; font-weight: 700; border: none;
            cursor: pointer; margin-bottom: 12px; font-size: 16px;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e02e53; }
        
        .back-btn { background: transparent; border: 1px solid #303030; color: #AAAAAA; }
        .back-btn:hover { background: #272727; color: #fff; }
        
        .msg { text-align: center; margin-bottom: 20px; font-size: 14px; padding: 12px; border-radius: 8px; display: none; font-weight: 500; }
        .msg.error { background: rgba(255, 78, 69, 0.1); color: #FF4E45; border: 1px solid #FF4E45; display: block; }
        .msg.success { background: rgba(43, 166, 64, 0.1); color: #2BA640; border: 1px solid #2BA640; display: block; }
        
        .debug-box {
            margin-top: 24px; padding: 12px; background: #000; border: 1px solid #333; 
            border-radius: 8px; font-family: monospace; font-size: 11px; color: #00ff00; 
            max-height: 150px; overflow-y: auto; word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/music-antenna-logo.png" alt="Music Antenna">
        </div>
        <h2>Create New Password</h2>
        <p class="subtitle" id="subtitle">Verifying secure link...</p>
        <div id="msg" class="msg"></div>
        
        <form id="resetForm">
            <div class="input-group">
                <input type="password" id="newPassword" placeholder="New Password" required minlength="6" disabled>
                <div class="toggle-eye" onclick="toggleVisibility('newPassword', this)">
                    <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </div>
            </div>
            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" required minlength="6" disabled>
                <div class="toggle-eye" onclick="toggleVisibility('confirmPassword', this)">
                    <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </div>
            </div>
            <button type="submit" id="submitBtn" disabled>Verifying Link...</button>
            <button type="button" class="back-btn" onclick="window.location.href='/'">Back to Login</button>
        </form>
        <div id="debugConsole" class="debug-box">Initializing...</div>
    </div>

    <script>
        const debugLog = (msg) => {
            const box = document.getElementById('debugConsole');
            box.innerHTML += "<br>> " + msg;
            console.log(msg);
        };

        debugLog("Page Loaded.");

        const SUPABASE_URL = 'https://wcuqehdequrealcndkyw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-iD2D0ploxUh4w_PLKOirQ_ih4JcGKt';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('resetForm');
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submitBtn');
        const p1Input = document.getElementById('newPassword');
        const p2Input = document.getElementById('confirmPassword');
        const subtitle = document.getElementById('subtitle');

        function toggleVisibility(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.style.color = '#FF0033';
            } else {
                input.type = 'password';
                icon.style.color = '#888';
            }
        }

        function unlockForm() {
            p1Input.disabled = false;
            p2Input.disabled = false;
            btn.disabled = false;
            btn.textContent = 'Update Password';
            btn.style.background = '#FF0033';
            subtitle.textContent = 'Your old password has been invalidated.';
            msg.style.display = 'none';
            debugLog("✅ Form unlocked.");
        }

        async function initAuth() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenHash = urlParams.get('token_hash');
            const type = urlParams.get('type');
            const code = urlParams.get('code');

            // 1. Token Hash Flow
            if (tokenHash && type === 'recovery') {
                debugLog("Attempting verifyOtp...");
                const { data, error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
                if (!error && data.session) {
                    debugLog("✅ verifyOtp success.");
                    unlockForm(); return;
                }
                debugLog("❌ verifyOtp error: " + (error?.message || 'Unknown'));
            }

            // 2. PKCE Code Flow
            if (code) {
                debugLog("Attempting exchangeCodeForSession...");
                const { data, error } = await supabase.auth.exchangeCodeForSession(code);
                if (!error && data.session) {
                    debugLog("✅ exchangeCode success.");
                    unlockForm(); return;
                }
                debugLog("❌ exchangeCode error: " + (error?.message || 'Unknown'));
            }

            // 3. Hash Token Flow
            if (window.location.hash.includes('access_token')) {
                debugLog("Attempting hash token parsing...");
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const access_token = hashParams.get('access_token');
                const refresh_token = hashParams.get('refresh_token');
                if (access_token && refresh_token) {
                    const { error } = await supabase.auth.setSession({ access_token, refresh_token });
                    if (!error) {
                        debugLog("✅ setSession success.");
                        unlockForm(); return;
                    }
                    debugLog("❌ setSession error: " + (error?.message || 'Unknown'));
                }
            }

            // 4. Existing Session Fallback
            debugLog("Checking for existing session...");
            const { data } = await supabase.auth.getSession();
            if (data.session) {
                debugLog("✅ Existing session found.");
                unlockForm();
            } else {
                debugLog("❌ No session found.");
                msg.style.display = 'block';
                msg.className = 'msg error';
                msg.textContent = 'No secure session found. Please request a new link.';
                btn.textContent = 'Invalid Link';
                subtitle.textContent = 'No active session.';
            }
        }

        initAuth();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (p1Input.value !== p2Input.value) {
                msg.style.display = 'block';
                msg.className = 'msg error';
                msg.textContent = 'Passwords do not match.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';
            msg.style.display = 'none';
            debugLog("Attempting to update password...");

            try {
                const { error } = await supabase.auth.updateUser({ password: p1Input.value });
                if (error) throw error;

                msg.style.display = 'block';
                msg.className = 'msg success';
                msg.textContent = 'Password updated successfully! Redirecting...';
                debugLog("✅ Password updated.");
                
                await supabase.auth.signOut();
                setTimeout(() => window.location.href = '/', 2000);
            } catch (err) {
                msg.style.display = 'block';
                msg.className = 'msg error';
                msg.textContent = err.message || 'Error updating password.';
                btn.disabled = false;
                btn.textContent = 'Update Password';
                debugLog("❌ Update error: " + err.message);
            }
        });
    </script>
</body>
</html>
